name: Deploy to EC2 via SSM

# The server is a plain EC2 instance running the app under pm2 (NOT Elastic
# Beanstalk — despite the old workflow name, no EB environment has existed
# for a while, which is part of why deploys were silently failing). This
# workflow pushes a `git pull` + `npm install` + `pm2 restart` command to the
# instance through AWS Systems Manager (SSM) — no SSH key needed, just an
# IAM user scoped to ssm:SendCommand on this one instance.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy over SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters 'commands=[
              "sudo -u ubuntu bash -c \"cd /home/ubuntu/redheart-backend && git fetch origin && git reset --hard origin/main && git clean -fd -e .env -e node_modules -e uploads -e ecosystem.config.cjs && npm install --production && pm2 restart backend --update-env\""
            ]' \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          # Poll until the command finishes (SendCommand is async)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" ]]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::Deploy command finished with status $STATUS"
            exit 1
          fi
