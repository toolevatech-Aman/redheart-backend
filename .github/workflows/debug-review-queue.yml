name: Debug review queue
on: { workflow_dispatch: {} }
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: |
          COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --document-name AWS-RunShellScript --timeout-seconds 120 --parameters 'commands=["sudo -u ubuntu bash -c \"pm2 logs backend --lines 120 --nostream\""]' --query Command.CommandId --output text)
          for i in $(seq 1 24); do STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending); [[ "$STATUS" != Pending && "$STATUS" != InProgress ]] && break; sleep 5; done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output json
          [[ "$STATUS" == Success ]]
